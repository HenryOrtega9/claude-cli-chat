<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Backstop for the renderer's node integration: with no CSP, an inline
         event handler smuggled through rendered markdown executes with
         `require` in scope. `file:` rides alongside 'self' on every directive
         because this document is loaded over file://, where 'self' is an
         opaque origin Chromium does not reliably match — 'self' alone would
         block ./dist/renderer.js and the two stylesheets outright.
         'unsafe-inline' for styles is load-bearing: the shell sets inline
         style properties (overlays, placeholders, popup anchoring).
         Nothing in this app uses fetch/XHR/WebSocket (desktop-http.ts goes
         through node:http, which CSP does not govern) or eval, so
         `default-src 'none'` costs nothing. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; base-uri 'none'; form-action 'none'"
    />
    <title>Claude</title>
    <!-- styles.css is the plugin stylesheet, shared verbatim; desktop.css
         supplies the Obsidian theme variables it expects and the panel chrome,
         so it must load second. -->
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./desktop.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./dist/renderer.js"></script>
  </body>
</html>
